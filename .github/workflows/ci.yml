name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/savora_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/savora_test
      API_PORT: 5000
      PORT: 5173
      BASE_PATH: /
      VITE_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Push database schema (test db)
        run: npm run push -w @workspace/db -- --force

      - name: Run API test suite
        run: npm run test -w @workspace/api-server

      - name: Run frontend test suite
        run: npm run test -w @workspace/savora

      - name: Build all packages
        run: npm run build --workspaces --if-present
